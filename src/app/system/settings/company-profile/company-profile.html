<div class="settings-panel d-flex flex-column h-100 pb-5">
  <div class="card settings-card mb-4">
    <div class="card-header border-0 pb-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <h5 class="card-title fs-6 mb-0">
        <i class="fa-regular fa-image text-success me-2"></i> Brand
      </h5>
    </div>
    <div class="card-body p-4 d-flex justify-content-between align-items-center flex-wrap gap-4">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-preview d-flex align-items-center justify-content-center">
          @if (logoUrl) {
            <img [src]="logoUrl" style="width: 100%; height: 100%; object-fit: cover;">
          } @else {
            <i class="fa-solid fa-box text-success fs-4"></i>
          }
        </div>
        <input type="file" #fileInput (change)="onLogoUpload($event)" accept="image/*" style="display: none;">
        <button class="btn btn-primary px-4 py-2" (click)="fileInput.click()"
          style="background-color: var(--primary-color); border: none; color: white; border-radius: 20px;">Upload
          logo</button>
        <button class="btn btn-settings-cancel px-4 py-2" (click)="removeLogo()" style="border-radius: 20px;">Remove</button>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="settings-desc small">Brand color</span>
        <input type="color" class="color-picker-input" [(ngModel)]="brandColor">
      </div>
    </div>
  </div>

  <!-- Company Profile Section -->
  <div class="card settings-card mb-4">
    <div class="card-header border-0 pb-0 pt-4 px-4">
      <h5 class="card-title fs-6 mb-0">
        <i class="fa-regular fa-building text-success me-2"></i> Company Profile
      </h5>
    </div>
    <div class="card-body p-4">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label mb-2">Company Name</label>
          <input type="text" class="form-control" value="Parcelix Logistics" placeholder="Enter company name">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Legal Name</label>
          <input type="text" class="form-control" value="Parcelix Logistics, Inc." placeholder="Enter legal name">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Support Email</label>
          <input type="email" class="form-control" value="support@Parcelix.com" placeholder="Enter support email">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Phone</label>
          <input type="text" class="form-control" value="+1 555 000 1234" placeholder="Enter phone number">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Website</label>
          <input type="text" class="form-control" value="https://Parcelix.com" placeholder="Enter website URL">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Tax / Registration No.</label>
          <input type="text" class="form-control" value="US-93-1827465" placeholder="Enter tax/registration no.">
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Industry</label>
          <select class="form-select custom-select">
            <option>Courier & Delivery</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label mb-2">Company Size</label>
          <select class="form-select custom-select">
            <option>11-50</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label mb-2">Head Office Address</label>
          <input type="text" class="form-control" value="142 Industrial Ave, Los Angeles, CA 90001" placeholder="Enter full address">
        </div>
        <div class="col-12">
          <label class="form-label mb-2">About</label>
          <textarea class="form-control" rows="3" placeholder="A short description of your company..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="d-flex justify-content-end gap-3 mt-3">
    <button class="btn btn-settings-cancel px-4 py-2" style="border-radius: 20px;">Cancel</button>
    <button class="btn btn-settings-save px-4 py-2" style="border-radius: 20px;"><i class="fa-solid fa-check me-2"></i>
      Save Changes</button>
  </div>
</div>
