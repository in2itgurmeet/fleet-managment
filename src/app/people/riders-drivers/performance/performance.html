<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <div class="icon-box" style="background-color: rgba(34, 197, 94, 0.1); color: #22c55e;">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div class="title-wrap">
        <h1 class="page-title">Performance</h1>
        <p class="page-subtitle">Rider productivity, ratings and delivery quality metrics</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary">
        <i class="fa-regular fa-calendar"></i> This Week <i class="fa-solid fa-chevron-down ms-1"></i>
      </button>
      <button class="btn btn-secondary">
        <i class="fa-solid fa-download"></i> Export
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-header">
        <div class="stat-title-wrap" [class]="stat.colorClass">
          <i [class]="stat.icon"></i>
          <span>{{ stat.title }}</span>
        </div>
        <button class="more-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>

      <div class="stat-body">
        <div class="stat-value-row">
          <h2 class="stat-value">{{ stat.value }}</h2>
          <span class="stat-trend" [ngClass]="stat.trendUp ? 'trend-up' : 'trend-down'">
            <i class="fa-solid" [ngClass]="stat.trendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'"></i>
            {{ stat.trend }}
          </span>
        </div>

        <div class="stat-chart" [class]="stat.colorClass">
          <div class="chart-bar" *ngFor="let h of stat.chartData" [style.height.%]="h * 10"></div>
        </div>
        <div class="stat-footer">VS last week</div>
      </div>
    </div>
  </div>

  <!-- Top Riders Table -->
  <div class="card parcel-card mt-4">
    <div class="card-header">
      <i class="fa-solid fa-trophy text-success"></i>
      <h2 class="card-title">Top Riders</h2>
    </div>
    <div class="card-body p-3">
      <cats-data-grid [rowData]="topRiders" [colDefs]="colDefs" [totalRecords]="topRiders.length"
        [paginationRequired]="false" [sortingRequired]="false" [selectedRowEmpty]="true" [draggable]="false"
        [filterRequired]="false">
        
        <ng-template #customTemplate let-row let-col="colDef">
          <!-- Rank Column -->
          <ng-container *ngIf="col.fieldName === 'rank'">
            <span class="font-weight-bold">{{ row.rank }}</span>
          </ng-container>

          <!-- Rider Column -->
          <ng-container *ngIf="col.fieldName === 'name'">
            <div class="user-cell">
              <img [src]="row.avatar" alt="Avatar" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=' + row.name + '&background=random'">
              <span class="user-name">{{ row.name }}</span>
            </div>
          </ng-container>

          <!-- Rating Column -->
          <ng-container *ngIf="col.fieldName === 'rating'">
            <div class="rating-cell">
              <i class="fa-solid fa-star text-warning"></i> {{ row.rating }}
            </div>
          </ng-container>

          <!-- Earnings Column -->
          <ng-container *ngIf="col.fieldName === 'earnings'">
            <span class="font-weight-bold">{{ row.earnings }}</span>
          </ng-container>
        </ng-template>

      </cats-data-grid>
    </div>
  </div>

  <!-- Service Quality Bars -->
  <div class="card parcel-card mt-4">
    <div class="card-header">
      <i class="fa-solid fa-gauge-high text-success"></i>
      <h2 class="card-title">Service Quality</h2>
    </div>
    <div class="card-body">
      <div class="quality-grid">
        <div class="quality-item" *ngFor="let item of serviceQuality">
          <div class="quality-header">
            <span class="quality-label">{{ item.label }}</span>
            <span class="quality-value font-weight-bold">{{ item.value }}</span>
          </div>
          <div class="quality-bar-bg">
            <div class="quality-bar-fill" [style.width]="item.value"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
