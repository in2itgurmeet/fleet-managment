<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <div class="icon-box" style="background-color: rgba(34, 197, 94, 0.1); color: #22c55e;">
        <i class="fa-solid fa-motorcycle"></i>
      </div>
      <div class="title-wrap">
        <h1 class="page-title">Rider List</h1>
        <p class="page-subtitle">Manage your delivery fleet and monitor rider activity</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Add Rider
      </button>
      <button class="btn btn-secondary">
        <i class="fa-solid fa-download"></i> Export
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-header">
        <div class="stat-title-wrap" [class]="stat.colorClass">
          <i [class]="stat.icon"></i>
          <span>{{ stat.title }}</span>
        </div>
        <button class="more-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>

      <div class="stat-body">
        <div class="stat-value-row">
          <h2 class="stat-value">{{ stat.value }}</h2>
          <span class="stat-trend" [ngClass]="stat.trendUp ? 'trend-up' : 'trend-down'">
            <i class="fa-solid" [ngClass]="stat.trendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'"></i>
            {{ stat.trend }}
          </span>
        </div>

        <div class="stat-chart" [class]="stat.colorClass">
          <div class="chart-bar" *ngFor="let h of stat.chartData" [style.height.%]="h * 10"></div>
        </div>
        <div class="stat-footer">VS last week</div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-card">
    <div class="table-toolbar">
      <div class="tabs">
        <button class="tab-btn" *ngFor="let tab of tabs" [class.active]="activeTab === tab" (click)="setTab(tab)">
          {{ tab }}
        </button>
      </div>
      <div class="toolbar-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search rider, zone...">
        </div>
        <button class="filter-btn">
          <i class="fa-solid fa-filter"></i> Filter <i class="fa-solid fa-chevron-down ms-1"></i>
        </button>
      </div>
    </div>

    <div class="table-responsive p-3">
      <cats-data-grid [rowData]="riders" [colDefs]="colDefs" [totalRecords]="riders.length"
        [paginationRequired]="true" [sortingRequired]="true" [selectedRowEmpty]="true" [draggable]="true"
        [filterRequired]="false">
        
        <!-- Custom Template for RIDER column -->
        <ng-template #customTemplate let-row let-col="colDef">
          <ng-container *ngIf="col.fieldName === 'name'">
            <div class="user-cell">
              <img [src]="row.avatar" alt="Avatar" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=' + row.name + '&background=random'">
              <div class="user-info">
                <div class="user-name">{{ row.name }}</div>
                <div class="user-sub">{{ row.id }}</div>
              </div>
            </div>
          </ng-container>

          <ng-container *ngIf="col.fieldName === 'rating'">
            <div class="rating-cell">
              <i class="fa-solid fa-star text-warning"></i> {{ row.rating }}
            </div>
          </ng-container>

          <ng-container *ngIf="col.fieldName === 'action'">
            <button class="btn-icon">
              <i class="fa-regular fa-eye"></i>
            </button>
          </ng-container>
        </ng-template>

      </cats-data-grid>
    </div>
  </div>
</div>
