<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <div class="icon-box" style="background-color: rgba(34, 197, 94, 0.1); color: #22c55e;">
        <i class="fa-solid fa-file-invoice-dollar"></i>
      </div>
      <div class="title-wrap">
        <h1 class="page-title">Invoices</h1>
        <p class="page-subtitle">Create, send and reconcile client invoices</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" (click)="openNewInvoiceModal()">
        <i class="fa-solid fa-plus"></i> New Invoice
      </button>
      <button class="btn btn-secondary">
        <i class="fa-solid fa-download"></i> Export
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    @for (stat of stats; track stat.title) {
    <div class="stat-card">
      <div class="stat-header">
        <div class="stat-title-wrap" [class]="stat.colorClass">
          <i [class]="stat.icon"></i>
          <span>{{ stat.title }}</span>
        </div>
        <button class="more-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>

      <div class="stat-body">
        <div class="stat-value-row">
          <h2 class="stat-value">{{ stat.value }}</h2>
          <span class="stat-trend" [ngClass]="stat.trendUp ? 'trend-up' : 'trend-down'">
            <i class="fa-solid" [ngClass]="stat.trendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'"></i>
            {{ stat.trend }}
          </span>
        </div>

        <div class="stat-chart" [class]="stat.colorClass">
          @for (h of stat.chartData; track h) {
          <div class="chart-bar" [style.height.%]="h * 10"></div>
          }
        </div>
        <div class="stat-footer">VS last week</div>
      </div>
    </div>
    }
  </div>

  <!-- Table Section -->
  <div class="table-card">
    <div class="table-toolbar">
      <div class="tabs">
        @for (tab of tabs; track tab) {
        <button class="tab-btn" [class.active]="activeTab === tab" (click)="setTab(tab)">
          {{ tab }}
        </button>
        }
      </div>
      <div class="toolbar-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search invoice no., client...">
        </div>
        <button class="filter-btn">
          <i class="fa-solid fa-filter"></i> Filter <i class="fa-solid fa-chevron-down ms-1"></i>
        </button>
      </div>
    </div>

    <div class="table-responsive p-3">
      <cats-data-grid [rowData]="invoicesData" [colDefs]="colDefs" [totalRecords]="invoicesData.length"
        [paginationRequired]="true" [sortingRequired]="true" [selectedRowEmpty]="true" [draggable]="true"
        [filterRequired]="false">
      </cats-data-grid>
    </div>
  </div>
</div>

<!-- New Invoice Modal -->
 @if(isNewInvoiceModalOpen) {
   <div class="modal-overlay" (click)="closeNewInvoiceModal()">
     <div class="custom-modal" (click)="$event.stopPropagation()">
       <div class="modal-header">
         <div class="modal-title-wrapper">
           <div class="modal-icon-box">
             <i class="fa-solid fa-file-invoice"></i>
           </div>
           <h3 class="modal-title">New Invoice</h3>
         </div>
         <button class="close-btn green-outline" (click)="closeNewInvoiceModal()">
           <i class="fa-solid fa-xmark"></i>
         </button>
       </div>
       
       <div class="modal-body">
         <div class="form-group mb-3">
           <label>Client</label>
           <input type="text" class="form-control" placeholder="Acme Logistics Co.">
         </div>
         
         <div class="form-row">
           <div class="form-group half">
             <label>Issue Date</label>
             <input type="date" class="form-control" placeholder="mm/dd/yyyy">
           </div>
           <div class="form-group half">
             <label>Due Date</label>
             <input type="date" class="form-control" placeholder="mm/dd/yyyy">
           </div>
         </div>
         
         <div class="form-row">
           <div class="form-group half">
             <label>Amount</label>
             <input type="number" class="form-control" placeholder="0.00">
           </div>
           <div class="form-group half">
             <label>Status</label>
             <select class="form-select">
               <option>Draft</option>
               <option>Paid</option>
               <option>Unpaid</option>
               <option>Overdue</option>
             </select>
           </div>
         </div>
   
         <div class="form-group mb-4">
           <label>Notes</label>
           <textarea class="form-control" rows="3" placeholder="Optional notes..."></textarea>
         </div>
   
         <div class="modal-footer">
           <button class="btn-cancel" (click)="closeNewInvoiceModal()">Cancel</button>
           <button class="btn-submit">
             <i class="fa-regular fa-circle-check"></i> Create Invoice
           </button>
         </div>
       </div>
     </div>
   </div>
 }
