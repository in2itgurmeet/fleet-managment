<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <div class="icon-box">
        <i class="fa-solid fa-cube"></i>
      </div>
      <div class="title-wrap">
        <h1 class="page-title">All Shipments</h1>
        <p class="page-subtitle">Track and manage every parcel across your network</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary">
        <i class="fa-solid fa-download"></i> Export
      </button>
      <button class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Create Shipment
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-header">
        <div class="stat-title-wrap" [class]="stat.colorClass">
          <i [class]="stat.icon"></i>
          <span>{{ stat.title }}</span>
        </div>
        <button class="more-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
      
      <div class="stat-body">
        <div class="stat-value-row">
          <h2 class="stat-value">{{ stat.value }}</h2>
          <span class="stat-trend" [ngClass]="stat.trendUp ? 'trend-up' : 'trend-down'">
            <i class="fa-solid" [ngClass]="stat.trendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'"></i>
            {{ stat.trend }}
          </span>
        </div>
        
        <div class="stat-chart" [class]="stat.colorClass">
          <div class="chart-bar" *ngFor="let h of stat.chartData" [style.height.%]="h * 10"></div>
        </div>
        <div class="stat-footer">VS last week</div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-card">
    <div class="table-toolbar">
      <div class="tabs">
        <button 
          class="tab-btn" 
          *ngFor="let tab of tabs" 
          [class.active]="activeTab === tab"
          (click)="setTab(tab)">
          {{ tab }}
        </button>
      </div>
      <div class="toolbar-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search tracking ID, customer...">
        </div>
        <button class="filter-btn">
          <i class="fa-solid fa-filter"></i> Filter <i class="fa-solid fa-chevron-down ms-1"></i>
        </button>
      </div>
    </div>

    <div class="table-responsive p-3">
      <cats-data-grid 
        [rowData]="shipments" 
        [colDefs]="colDefs" 
        [totalRecords]="shipments.length" 
        [paginationRequired]="true" 
        [sortingRequired]="true"
        [selectedRowEmpty]="true"
        [draggable]="true"
        [filterRequired]="false">
      </cats-data-grid>
    </div>
  </div>
</div>
